<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PatasPerto — marketplace de produtos pet</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-modo="anon">
<header>
  <div class="header-linha">
    <div class="header-logo">
      <h1 id="logo">🐾 PatasPerto</h1>
      <p id="subtitulo">Produtos para o seu pet nas lojas mais perto de você</p>
    </div>
    <div class="busca-topo" role="search">
      <input id="campoBusca" type="text" placeholder="Buscar produto (ex.: ração, antipulgas, dental)" autocomplete="off" aria-label="Buscar produto">
      <button id="botaoBusca">Buscar</button>
    </div>
    <div class="header-acoes">
      <button id="btConta" class="conta" title="Minha conta">👤 <span id="contaNome">Perfil</span></button>
      <button id="btCarrinhoTopo" class="conta conta-icone" title="Carrinho" aria-label="Carrinho">🛒<span id="qtdCarrinho" class="qtd" hidden>0</span></button>
      <button id="btSair" class="conta" title="Entrar / sair da conta">Entrar</button>
    </div>
  </div>
</header>

<nav class="secoes">
  <button id="navLoja" class="ativo">🛒 Loja</button>
  <button id="navRec">🤖 Recomendação</button>
  <button id="navMapa">🗺️ Mapa</button>
  <button id="navEmg">🚑 Emergência</button>
</nav>

<div id="telaLista">
  <section class="hero">
    <div class="hero-texto">
      <h2 class="titulo-hero"><span class="t1">Tudo para o seu</span> <span class="t2">pet</span>
        <span class="apoio">Ração, saúde e diversão nas lojas mais perto de você</span></h2>
    </div>
    <div class="hero-arte" id="heroArte" aria-hidden="true"></div>
  </section>
  <div class="filtros">
    <button class="chip ativo" data-ord="preco">↓ Menor preço</button>
    <button class="chip" data-ord="perto">Mais perto</button>
  </div>
  <p class="info" id="info">Carregando ofertas…</p>
  <div class="grade" id="grade"></div>
</div>

<div id="telaProduto"></div>
<div id="telaEmergencia"></div>
<div id="telaRecomendacao"></div>
<div id="telaPerfil"></div>
<div id="telaMapa"></div>
<div id="telaLogin"></div>
<div id="telaPainel"></div>

<div id="toast" class="toast oculto"></div>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
