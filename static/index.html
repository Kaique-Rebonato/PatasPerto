<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PatasPerto — marketplace de produtos pet</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-modo="anon">
<header>
  <div class="header-linha">
    <div class="header-logo">
      <h1 id="logo"><img src="/static/img/logo.png" alt="PatasPerto" width="262" height="192"></h1>
      <p id="subtitulo">Produtos para o seu pet nas lojas mais perto de você</p>
    </div>
    <div class="busca-topo" role="search">
      <span data-ic="busca" class="busca-ic" aria-hidden="true"></span>
      <input id="campoBusca" type="search" placeholder="Buscar ração, antipulgas, petisco…" autocomplete="off" aria-label="Buscar produto">
      <button id="botaoBusca">Buscar</button>
    </div>
    <div class="header-acoes">
      <button id="btConta" class="conta" title="Minha conta" data-ic="usuario"><span id="contaNome">Perfil</span></button>
      <button id="btCarrinhoTopo" class="conta conta-icone" title="Carrinho" aria-label="Carrinho" data-ic="carrinho"><span id="qtdCarrinho" class="qtd" hidden>0</span></button>
      <button id="btSair" class="conta" title="Entrar / sair da conta">Entrar</button>
    </div>
  </div>
</header>

<nav class="secoes">
  <button id="navLoja" class="ativo" data-ic="loja">Loja</button>
  <button id="navRec" data-ic="ia">Recomendação</button>
  <button id="navMapa" data-ic="mapa">Mapa</button>
  <button id="navEmg" data-ic="pulso">Emergência</button>
</nav>

<div id="telaLista">
  <section class="hero">
    <div class="hero-texto">
      <h2 class="titulo-hero">Tudo pro seu pet, pertinho de casa</h2>
      <p class="apoio">Ração, saúde e diversão das lojas do seu bairro. E, se o pet precisar, a gente indica o veterinário certo.</p>
    </div>
    <figure class="hero-foto">
      <img src="/static/img/hero-salsicha.webp" alt="Cachorrinha salsicha preta e caramelo com três bolinhas de tênis na boca, olhando para a câmera" width="1200" height="897">
    </figure>
  </section>
  <div class="filtros">
    <button class="chip ativo" data-ord="preco">↓ Menor preço</button>
    <button class="chip" data-ord="perto">Mais perto</button>
  </div>
  <p class="info" id="info">Carregando ofertas…</p>
  <div class="grade" id="grade"></div>
</div>

<div id="telaProduto"></div>
<div id="telaCarrinho"></div>
<div id="telaEmergencia"></div>
<div id="telaRecomendacao"></div>
<div id="telaPerfil"></div>
<div id="telaMapa"></div>
<div id="telaLogin"></div>
<div id="telaPainel"></div>

<div id="toast" class="toast oculto"></div>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
